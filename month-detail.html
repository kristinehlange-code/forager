            <div id="just-out-block" class="mb-6 hidden">

            </div>

                <div id="still-fresh-list" class="flex flex-wrap gap-2"></div>
            </div>

            </div>
        </section>
        <section class="mb-10">

            <div id="recipe-list" class="two-col space-y-4 md:space-y-0"></div>

        <section class="mb-12 border-t border-gray-100 pt-8">

            const prevIdx = (idx - 1 + 12) % 12;
            const nextIdx = (idx + 1) % 12;
            const prevKey = MONTH_KEYS[prevIdx];
            const nextKey = MONTH_KEYS[nextIdx];
            const prevData = monthData[prevKey];
            const nextData = monthData[nextKey];

            document.getElementById('prev-label').textContent = prevData.name;
            document.getElementById('prev-label').style.color = prevData.color;
            document.getElementById('prev-link').href = `month-detail.html?m=${prevKey}`;

            document.getElementById('next-label').textContent = nextData.name;
            document.getElementById('next-label').style.color = nextData.color;
            document.getElementById('next-link').href = `month-detail.html?m=${nextKey}`;

            // This month's harvest (new three-tier section — only drafted for some months so far)
            const harvest = harvestNotes[key];
            const harvestSection = document.getElementById('harvest-section');
            if (harvest) {
                harvestSection.classList.remove('hidden');

                    a.className = 'px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm hover:border-gray-400 transition-colors';
                    a.textContent = p.name;
                    return a;
                };
                const lastCallChip = (p) => {
                    const a = chip(p);
                    a.className = 'px-3 py-1.5 bg-amber-50 border border-amber-200 text-amber-800 rounded-full text-sm hover:border-amber-400 transition-colors';
                    return a;
                };

                const justOutBlock = document.getElementById('just-out-block');
                const justOutList = document.getElementById('just-out-list');
                justOutList.innerHTML = '';
                if (harvest.justOut && harvest.justOut.length) {
                    justOutBlock.classList.remove('hidden');
                    harvest.justOut.forEach(p => justOutList.appendChild(chip(p)));
                } else {
                    justOutBlock.classList.add('hidden');
                }

                const stillFreshBlock = document.getElementById('still-fresh-block');
                const stillFreshList = document.getElementById('still-fresh-list');
                stillFreshList.innerHTML = '';

                    stillFreshBlock.classList.remove('hidden');
                    harvest.stillFresh.forEach(p => stillFreshList.appendChild(chip(p)));
                } else {
                    stillFreshBlock.classList.add('hidden');
                }

                const dontMissBlock = document.getElementById('dont-miss-block');
                const lastCallList = document.getElementById('last-call-list');
                const curatedNotes = document.getElementById('curated-notes');
                lastCallList.innerHTML = '';
                curatedNotes.innerHTML = '';
                const hasLastCall = harvest.lastCall && harvest.lastCall.length;
                const hasCurated = harvest.curated && harvest.curated.length;
                if (hasLastCall || hasCurated) {
                    dontMissBlock.classList.remove('hidden');

                        const label = document.createElement('p');
                        label.className = 'text-xs text-gray-400 mb-2 w-full';

                }
            } else {
                harvestSection.classList.add('hidden');
            }

            // Recipes
            const recipeList = document.getElementById('recipe-list');
            recipeList.innerHTML = '';
            data.recipes.forEach(r => {
                const card = document.createElement('a');
                card.href = `recipe-detail.html?id=${r.name.toLowerCase().replace(/'/g,'').replace(/\s+/g,'-')}`;
                card.className = 'bg-white rounded-2xl shadow-sm border border-gray-50 block hover:shadow-md transition-shadow overflow-hidden flex';
                card.innerHTML = `
                    <div class="w-1.5 flex-shrink-0 rounded-l-2xl" style="background-color:${data.color}"></div>
                    <div class="p-5 flex-1">
                        <h3 class="text-lg font-bold">${r.name}</h3>
                        <p class="text-xs font-bold tracking-widest mt-1 mb-2 text-gray-400 uppercase">${r.ingredient}</p>
                        <p class="text-sm text-gray-500">${r.desc}</p>
                    </div>
                `;
                recipeList.appendChild(card);
            });

            // Preserve
            document.getElementById('preserve-note').textContent = data.preserve;

            // Page title
            document.title = `FORAGER — ${data.name}`;
        }

        render();
        lucide.createIcons();
    </script>
</body>
</html>
